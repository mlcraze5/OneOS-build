# Publishes x9u-in-1105-sultra's four local-only set files as a release whose
# assets are named by their SHA-256 (the names the OneOS app downloads them
# under; SetDownloader.url()). The files themselves are the exact bytes kept on
# the branch set-files/<tag> (built and checked when they were pinned); this
# workflow joins any split parts, checks each file against the hash pinned in
# app-android/packages/x9u-in-1105-sultra.sha256, and only if all four match
# publishes them. Rebuilding them on the runner instead gave other bytes (run
# 43720493041: apktool's output differs between machines), so a rebuild could
# never match the pins. The owner runs this by hand from the Actions tab:
# pressing "Run workflow" is the publication. There is no push or schedule
# trigger, so nothing here publishes on its own.
name: Publish set files

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the assets under (the app's gh:<tag> source)."
        required: true
        default: "coloros-1105-r5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SET_ID: x9u-in-1105-sultra
      SHAFILE: app-android/packages/x9u-in-1105-sultra.sha256
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Same shape SetDownloader.url() and build.gradle.kts require of a gh:<tag>.
          if ! printf '%s' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9.-]{0,39}$'; then
            echo "::error::tag '$TAG' is not ^[a-z0-9][a-z0-9.-]{0,39}\$" >&2
            exit 1
          fi
          echo "Publishing under tag: $TAG"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The exact files from set-files/<tag>, parts joined, under their plain
      # names for the check below.
      - name: Take the set files from set-files/${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/heads/set-files/$TAG:refs/remotes/origin/set-files/$TAG"
          mkdir -p set
          git --work-tree=set checkout "origin/set-files/$TAG" -- files
          cd set/files
          for first in *.part-00; do
            [ -e "$first" ] || continue
            base=${first%.part-00}
            cat "$base".part-* > "$base"
            rm -f "$base".part-*
          done
          cd ../..
          for f in SystemUI_wave.dex ColorPanoramicSystemUI.apk services_patched.jar guards.txt; do
            sha=$(awk -v n="$f" '$1 ~ /^[0-9a-f]{64}$/ && $2 == n {print $1; exit}' "$SHAFILE")
            [ -n "$sha" ] || { echo "::error::$f has no pinned hash in $SHAFILE" >&2; exit 1; }
            [ -f "set/files/$sha" ] || { echo "::error::set-files/$TAG has no file $sha ($f)" >&2; exit 1; }
            cp "set/files/$sha" "$f"
          done

      # Verify the four files against the pins read from the .sha256 file,
      # then stage each under its own SHA-256 name (the asset name the app fetches).
      # Any mismatch fails the job here, before any release is touched.
      - name: Verify against pinned hashes
        run: |
          set -euo pipefail
          mkdir -p assets
          fail=0
          for f in SystemUI_wave.dex ColorPanoramicSystemUI.apk services_patched.jar guards.txt; do
            expected=$(awk -v n="$f" '$1 ~ /^[0-9a-f]{64}$/ && $2 == n {print $1; exit}' "$SHAFILE")
            if [ -z "$expected" ]; then
              echo "::error::$f has no pinned hash in $SHAFILE" >&2
              fail=1; continue
            fi
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$f sha256 mismatch: expected $expected, got $actual" >&2
              fail=1; continue
            fi
            echo "OK  $f  $actual"
            # Asset named by its SHA-256, as SetDownloader downloads it.
            cp "$f" "assets/$expected"
          done
          [ "$fail" -eq 0 ] || { echo "::error::one or more files did not match; publishing nothing" >&2; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="Set files of ${SET_ID}, with each asset named by its SHA-256, the name the OneOS app downloads it under. services_patched.jar carries the guard that fails a fingerprint or face enroll, or a removal, in the guest before Samsung's HAL, so the guest removes or enrolls none of One UI's biometrics. From coloros-1105-r4 on it also opens Samsung's AIDL fingerprint HAL instead of the absent HIDL 2.1 adapter (patches/guest_force_aidl_fingerprint.py), which kept fingerprint off the guest's lock screen. From coloros-1105-r5 on SystemUI_wave.dex and ColorPanoramicSystemUI.apk draw the fingerprint wake glyph from SystemUI's fingerprint UI thread instead of the main thread, which crashed SystemUI at every screen on. All four are checked against the hashes pinned in the repo before publishing; not yet tried on a phone."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TAG" --notes "$notes"
          fi
          gh release upload "$TAG" \
            "assets/$(sha256sum SystemUI_wave.dex | cut -d' ' -f1)" \
            "assets/$(sha256sum ColorPanoramicSystemUI.apk | cut -d' ' -f1)" \
            "assets/$(sha256sum services_patched.jar | cut -d' ' -f1)" \
            "assets/$(sha256sum guards.txt | cut -d' ' -f1)" \
            --clobber

      - name: Job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "### x9u-in-1105-sultra set files"
            echo ""
            echo "| file | size (bytes) | sha256 |"
            echo "|---|---|---|"
            for f in SystemUI_wave.dex ColorPanoramicSystemUI.apk services_patched.jar guards.txt; do
              if [ -f "$f" ]; then
                printf '| `%s` | %s | `%s` |\n' "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
              else
                printf '| `%s` | — | missing |\n' "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
